# Professional portfolio, published by GitHub Pages.
locale: "en-CA"
title: "Luís Pedro Borges"
title_separator: "|"
name: "Luís Pedro Pires Borges"
description: "Information Retrieval, Machine Learning and NLP researcher; Ph.D. in progress. Open to research, ML and data roles in Canada and Europe. Canadian IEC Working Holiday approved; work permit activation on arrival."
url: "https://luispb7.github.io"
baseurl: ""
repository: "LuisPB7/LuisPB7.github.io"
timezone: "Europe/Lisbon"
encoding: "utf-8"
future: false
breadcrumbs: false
words_per_minute: 160
og_image: "profile.png"

author:
  name: "Luís Pedro Borges"
  avatar: "profile.png"
  bio: "Ph.D. in progress · Instituto Superior Técnico & Carnegie Mellon University"
  location: "Lisbon, Portugal"
  email: "lpborges.careers@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=_BkmlLUAAAAJ&hl=en"
  github: "LuisPB7"
  linkedin: "luís-borges-2a3462116"

social:
  type: Person
  name: "Luís Pedro Borges"
  links:
    - "https://scholar.google.com/citations?user=_BkmlLUAAAAJ&hl=en"
    - "https://github.com/LuisPB7"
    - "https://www.linkedin.com/in/luís-borges-2a3462116"

analytics:
  provider: false
comments:
  provider: false

include:
  - _pages
  - files
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - assets/js
  - node_modules
  - package.json
  - scripts
  - resume
  - tmp
  - vendor

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
